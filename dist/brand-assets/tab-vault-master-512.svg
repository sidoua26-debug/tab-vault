<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate to Oceanic Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Edge Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#2563EB" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.2" />
    </linearGradient>

    <!-- Primary Accent Gradient (Luminous Cyan to Royal Blue) -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Vault Metal Gradient -->
    <linearGradient id="vaultMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Vault Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Central Lock Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Beveled Border -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="5" />
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#ambientGlow)" />

  <!-- Layer 1: Back Tab (Recessed) -->
  <g opacity="0.45">
    <path d="M152 144 C152 130 163 120 178 120 L334 120 C349 120 360 130 360 144 L360 176 L152 176 Z" fill="#334155" />
    <rect x="136" y="172" width="240" height="20" rx="6" fill="#1E293B" />
  </g>

  <!-- Layer 2: Middle Tab -->
  <g opacity="0.75">
    <path d="M128 184 C128 170 139 160 154 160 L358 160 C373 160 384 170 384 184 L384 216 L128 216 Z" fill="#1E40AF" stroke="#3B82F6" stroke-width="2" />
  </g>

  <!-- Layer 3: Front Primary Vault Safe Container (The Master Tab Card) -->
  <g filter="url(#softShadow)">
    <!-- Tab Shape Header -->
    <path d="M104 228 C104 210 118 196 136 196 L248 196 C258 196 266 202 272 210 L286 228 L376 228 C394 228 408 242 408 260 L408 392 C408 410 394 424 376 424 L136 424 C118 424 104 410 104 392 Z" 
          fill="url(#tabGrad)" 
          stroke="#60A5FA" 
          stroke-width="4" />

    <!-- Sleek Top Edge Highlight -->
    <path d="M136 200 L248 200 C256 200 263 205 268 212 L282 230 L376 230" 
          fill="none" 
          stroke="#BAE6FD" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.8" />
  </g>

  <!-- Inner Vault Door Cavity -->
  <circle cx="256" cy="326" r="74" fill="#090D1A" stroke="#1E293B" stroke-width="6" />

  <!-- Outer Vault Rotary Gear / Dial Ring -->
  <circle cx="256" cy="326" r="64" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="8 6" />

  <!-- Vault Wheel 3-Spoke Handle (Iconic Bank Safe Wheel) -->
  <g filter="url(#tabGlow)">
    <!-- Spoke 1 (Vertical Top) -->
    <rect x="251" y="258" width="10" height="26" rx="5" fill="url(#vaultMetal)" />
    <!-- Spoke 2 (Bottom Left, 120 deg) -->
    <rect x="251" y="258" width="10" height="26" rx="5" fill="url(#vaultMetal)" transform="rotate(120 256 326)" />
    <!-- Spoke 3 (Bottom Right, 240 deg) -->
    <rect x="251" y="258" width="10" height="26" rx="5" fill="url(#vaultMetal)" transform="rotate(240 256 326)" />

    <!-- Center Rotary Hub -->
    <circle cx="256" cy="326" r="32" fill="url(#vaultMetal)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="256" cy="326" r="22" fill="#0A0F1D" stroke="#0284C7" stroke-width="3" />
  </g>

  <!-- Glowing Security Core (The Emerald/Cyan Protection Jewel) -->
  <circle cx="256" cy="326" r="10" fill="#38BDF8" />
  <circle cx="256" cy="326" r="5" fill="#FFFFFF" />

  <!-- Subtle Bolt Rivets on Front Panel -->
  <circle cx="128" cy="254" r="5" fill="#93C5FD" opacity="0.7" />
  <circle cx="384" cy="254" r="5" fill="#93C5FD" opacity="0.7" />
  <circle cx="128" cy="396" r="5" fill="#93C5FD" opacity="0.7" />
  <circle cx="384" cy="396" r="5" fill="#93C5FD" opacity="0.7" />
</svg>