name: Tab Vault CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Unit & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run Real-Browser E2E Tests
        run: |
          export CHROMIUM_BIN=$(which chromium || which google-chrome || echo "/usr/bin/google-chrome")
          node --test tests/e2e/*.test.js
